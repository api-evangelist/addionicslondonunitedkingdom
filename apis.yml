aid: addionicslondonunitedkingdom
name: Addionics
description: 'Addionics is a Smart Metals manufacturer headquartered in London, United Kingdom, with
  operations in Israel, Korea and the USA, building Smart 3D Porous Current Collectors that replace the flat
  copper and aluminium foils inside a battery cell with a porous, ion-permeable metal architecture. The
  technology is chemistry-agnostic and drop-in, produced roll-to-roll on existing coating lines, and is sold
  into robotics, defence, space and EV programmes. Addionics is a hardware and materials company: it operates
  no developer program and publishes no API, SDK, webhook or machine-readable API contract. It does run a
  deliberate agent-readable content surface on its own domain — a served /llms.txt digest, a published
  /agents.md agent guide, a markdown twin of every page under Accept: text/markdown, a complete /sitemap.xml
  and an RSS blog feed — all captured in this profile.'
